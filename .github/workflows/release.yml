# Releases the app when a version tag is pushed (VERSION must already match):
#   git tag -a v1.2.3 -m "First note" -m "Second note" && git push origin v1.2.3
# scripts/release-ci.sh builds with the update feed, runs the tests and the self-test, signs and notarizes when the
# Apple secrets exist, and signs the update for Sparkle when SPARKLE_PRIVATE_KEY exists. This job then publishes a
# GitHub release with the zip and update.json (marked pre-release until the app is notarized) and asks kitedrake.com
# to rebuild, which lists it for download and in the update feed.
# A push to main that changes this file or the script, and a manual run, do a dry run: everything but publishing.

name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release-ci.sh"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_NAME: Recast
  UPDATE_FEED_URL: https://kitedrake.com/updates/recast/appcast.xml
  UPDATE_PUBLIC_KEY: bZkd2GDiJ0s/vz7rM4jmQ6zPnhc8CFQabZRarEUEr6o=
  MINIMUM_MACOS: "26.0"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    # Tag runs use the "release" environment: give it a required reviewer to approve each release by hand.
    environment: ${{ github.ref_type == 'tag' && 'release' || 'dry-run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, test and pack
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: sh scripts/release-ci.sh

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          python3 -c "import json, sys; sys.exit(0 if json.load(open('out/update.json'))['notarized'] else 1)" \
            || flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" out/*.zip out/update.json \
            --title "$APP_NAME ${GITHUB_REF_NAME#v}" --notes-file out/notes.md $flags

      # A release starts the site's deploy workflow, so kitedrake.com lists it right away. SITE_REPO names the site's
      # repository and SITE_DISPATCH_TOKEN may run its workflows (Actions read and write on that repository only).
      # A dry run only checks that the token reaches the site. Without them the site lists it at its next daily build.
      - name: Ask kitedrake.com to list the release
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SITE_REPO: ${{ secrets.SITE_REPO }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ] || [ -z "$SITE_REPO" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN or SITE_REPO isn't set, so kitedrake.com lists releases at its next daily build."
            exit 0
          fi
          workflow="https://api.github.com/repos/$SITE_REPO/actions/workflows/deploy.yml"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            curl -fsS -X POST -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$workflow/dispatches" -d '{"ref":"main"}'
          else
            curl -fsS -o /dev/null -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$workflow"
            echo "The token reaches the site's deploy workflow."
          fi
